name: Lambda CI/CD

on:
  push:
    branches: [main]
    paths:
      - "scripts/lambda/**"
      - ".github/workflows/lambda_cicd.yml"

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r scripts/lambda/requirements-dev.txt

      - name: Run tests
        working-directory: scripts/lambda
        run: pytest tests/ -v

  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lambda runtime image
        run: |
          docker build -t lifesync-identity-enricher-ci -f - . <<'DOCKERFILE'
          FROM public.ecr.aws/lambda/python:3.11
          WORKDIR /var/task
          COPY scripts/lambda/lifesync_identity_enricher.py .
          COPY scripts/lambda/tests ./tests
          RUN python -m py_compile lifesync_identity_enricher.py
          DOCKERFILE

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-git --redact -v --exit-code=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bandit
        run: |
          pip install bandit
          bandit -r scripts/lambda/ -ll --exclude scripts/lambda/build,scripts/lambda/tests

  deploy:
    name: Mirror to CodeCommit
    needs: [unit-test, docker-build-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Mirror to CodeCommit
        run: |
          git config --global credential.helper '!aws codecommit credential-helper $@'
          git config --global credential.UseHttpPath true
          git remote add codecommit https://git-codecommit.ap-northeast-2.amazonaws.com/v1/repos/lifesync-data-lambda
          git push codecommit HEAD:main --force
