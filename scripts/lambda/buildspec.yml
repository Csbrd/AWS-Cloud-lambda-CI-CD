version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install -r scripts/lambda/requirements-dev.txt

  pre_build:
    commands:
      - echo "Running unit tests..."
      - cd scripts/lambda && pytest tests/ -v
      - cd $CODEBUILD_SRC_DIR

  build:
    commands:
      - echo "Packaging and deploying lifesync-identity-enricher..."
      - rm -rf /tmp/lambda_pkg /tmp/lifesync_identity_enricher.zip
      - mkdir -p /tmp/lambda_pkg
      - pip install --no-cache-dir -r scripts/lambda/requirements.txt -t /tmp/lambda_pkg
      - cp scripts/lambda/lifesync_identity_enricher.py /tmp/lambda_pkg/index.py
      - cd /tmp/lambda_pkg && zip -r /tmp/lifesync_identity_enricher.zip .
      - cd $CODEBUILD_SRC_DIR
      - ls -lh /tmp/lifesync_identity_enricher.zip
      - aws s3 cp /tmp/lifesync_identity_enricher.zip s3://lifesync-script-bucket/lambda/lifesync_identity_enricher.zip
      - |
        aws lambda update-function-code \
          --function-name lifesync-identity-enricher \
          --s3-bucket lifesync-script-bucket \
          --s3-key lambda/lifesync_identity_enricher.zip

  post_build:
    commands:
      - echo "Lambda deployment complete"

artifacts:
  files:
    - "**/*"
